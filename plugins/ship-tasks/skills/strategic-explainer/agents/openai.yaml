interface:
  display_name: "Strategic Explainer"
  short_description: "Объяснить смысл или переписать сложный текст без потерь"
  default_prompt: "Примени $strategic-explainer: удерживай исходный вопрос и его уровень, сначала объясни обычными русскими словами, что произошло, почему это важно и что будет дальше, затем добавь только необходимые точные технические названия. Проверь, сможет ли читатель без внутренней предметной области пересказать суть. По явному запросу на редактуру глубоко перестрой исходный текст без потери требований, фактов, исключений и границ."

policy:
  allow_implicit_invocation: true
