interface:
  display_name: "Strategic Explainer"
  short_description: "Связать проблему, стратегию и текущий результат"
  default_prompt: "Примени $strategic-explainer: проверь поставленную проблему, при необходимости найди достаточный стратегический контекст в доступных источниках только для чтения и верни готовое объяснение на языке пользователя. Не принимай новых решений и не превращай текст в смесь русского с внутренним английским жаргоном."

policy:
  allow_implicit_invocation: true
