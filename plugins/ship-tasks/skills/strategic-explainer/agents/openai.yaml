interface:
  display_name: "Strategic Explainer"
  short_description: "Объяснить смысл или переписать сложный текст без потерь"
  default_prompt: "Примени $strategic-explainer: проверь поставленную проблему, при необходимости найди достаточный стратегический контекст в доступных источниках только для чтения и верни готовое объяснение на языке пользователя. Если явно запрошена редактура, перестрой текст настолько глубоко, насколько нужно для ясности, но сохрани все факты, требования, исключения и границы. Не принимай новых решений и не превращай текст в смесь русского с внутренним английским жаргоном."

policy:
  allow_implicit_invocation: true
