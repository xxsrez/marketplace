interface:
  display_name: "Strategic Explainer"
  short_description: "Связать проблему, стратегию и текущий результат"
  default_prompt: "Примени $strategic-explainer: проверь явно переданную проблему, самостоятельно найди bounded strategic context через read-only sources и объясни смысл текущего результата без новых решений."

policy:
  allow_implicit_invocation: true
