interface:
  display_name: "Strategic Explainer"
  short_description: "Объяснить смысл или переписать сложный текст без потерь"
  default_prompt: "Примени $strategic-explainer как fresh stateless API: новый default subagent с fork_turns=none получает одну compact user-facing задачу и source anchors без inherited context. Проверь invocation, сам собери read-only facts и strategic meaning, сначала дай одну главную причинную мысль, затем только material detail. По явной редактуре перестрой target text без потери требований, фактов, исключений и границ."

policy:
  allow_implicit_invocation: true
