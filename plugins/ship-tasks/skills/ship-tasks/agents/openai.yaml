interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks для выбранного Task Manager scope. Разреши live scope и безопасно продолжи существующий незавершённый task-owned worktree/branch, если прежний writer остановлен и ownership exclusive. Соблюди natural-language правила пользователя о числе, ролях и условиях для субагентов; без такого правила выбери полезную delegation автоматически. Изолируй concurrent implementation writers по отдельным feature branches и Git worktrees. Не ослабляй acceptance, соблюдай comment/status/release boundaries из skill и доведи работу до проверенного результата с правдивым SHIPTASK RUN REPORT."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
