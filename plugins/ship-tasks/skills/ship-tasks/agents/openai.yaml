interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks для выбранного Task Manager scope. Сам выбери инструменты, порядок delivery и достаточный способ проверки. Goal создавай только для реальной implementation/rework минимум двух Tasks; Project/Release selector и release-only, включая production, работают без нового Goal. Не ослабляй acceptance и не называй непроверенное verified. Native comments обязательны: существенный status transition выполняй только после понятного Task comment и read-back. Приёмочный incident немедленно покажи в chat, зафиксируй opening comment до repair, затем сохрани resolution/retest и incident ledger в final report. Доказанный defect верни в In Progress и продолжай rework; при verification blocker оставь In Review и рекомендуй strongest feasible путь; при success после completion comment переведи в Done."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
