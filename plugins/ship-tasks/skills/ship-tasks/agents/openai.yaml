interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks. Goal создавай только для реальной implementation/rework минимум двух Tasks; release-only, включая production, работают без нового Goal. Не ослабляй acceptance. Обычный To Do → In Progress не создаёт комментарий. Каждый комментарий ShipTask до публикации обязательно передай отдельному независимому $ship-tasks:strategic-explainer; основной агент не заменяет его собственной редактурой. Переход выполняй только после comment/read-back. Приёмочный incident немедленно покажи в chat и зафиксируй opening comment до repair; incident ledger в final report. Дефект верни в In Progress; blocker оставь в In Review; success закрывай только после completion comment."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
