interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks для выбранного Task Manager scope. Сам выбери инструменты, порядок delivery и достаточный способ проверки. Goal создавай только для реальной implementation/rework минимум двух Tasks; Project/Release selector и release-only, включая production, работают без нового Goal. Соблюдай constitution: не ослабляй acceptance, не называй непроверенное verified, а существенный status transition выполняй только после понятного native Task comment и его read-back. В In Review различай противоречие Task, доказанный defect, невозможность приёмки и доказанный success. При defect после комментария верни Task в In Progress и продолжай rework; при verification blocker оставь In Review и предложи способы приёмки; при success после комментария переведи в Done."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
