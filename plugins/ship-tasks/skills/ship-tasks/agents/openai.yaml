interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks. Default subagents=auto: после live inventory active target равен min(ready independent work, conflict-free ownership/isolation, runtime, integration/verification/review capacity); любой меньший target требует concrete limiter. Одновременно заполни target bounded workers. Основной агент — единственный integration owner и владелец Goal и Task Manager comments/status/version writes. Явный user profile для subagents приоритетен. Без него только genuinely simple bounded packets запускай на gpt-5.6-luna/max; остальные и Strategic Explainer наследуют current model/effort. При ambiguity, unexpected environment/tool state или proof gap Luna прекращает corrective mutations, делает bounded read-back partial effects и передаёт exact handoff integration owner/current profile без cheap Luna retry loop. При current primary=Luna unresolved uncertainty сообщи luna-escalation=not-available без hidden Sol; explicit unavailable profile не подменяй. Общие 'не используй субагентов'/'без субагентов'/no subagents означают subagents=off и ноль subagents во всём run, включая comment Explainer; узкий запрет отключает только названную роль и сообщается как subagents=auto; role=off. Различай workers=not-available и comment-explainer=not-available. Goal создавай только для реальной implementation/rework минимум двух Tasks; release-only, включая production, работают без нового Goal. Не ослабляй acceptance. Обычный To Do → In Progress не создаёт комментарий. При subagents=auto каждый комментарий ShipTask до публикации обязательно передай отдельному независимому $ship-tasks:strategic-explainer; при общем off примени quality contract напрямую без claim независимости. Переход выполняй только после comment/read-back. Приёмочный incident немедленно покажи в chat и зафиксируй opening comment до repair; incident ledger в final report. Дефект верни в In Progress; blocker оставь в In Review; success закрывай только после completion comment."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
