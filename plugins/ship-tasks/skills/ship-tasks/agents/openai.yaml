interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks для выбранного Task Manager scope. Разреши live scope; продолжай task-owned worktree/branch только при exclusive ownership. Соблюди natural-language правила пользователя; без такого правила выбери полезную delegation автоматически. Изолируй writers по отдельным feature branches и Git worktrees. Сделай targeted gate каждой Task. Периодический UAT batch release — один exact candidate в verified UAT; UAT — разрешённый non-production effect, UAT read-back/smoke обязателен. Не ослабляй acceptance: critical-codebase-accepted допустим лишь после normal frontier, когда нет To Do/In Progress, все remaining In Review verification-blocked и требуют substantial human verifier, не bounded unlocker. Ровно один read-only critic с fork_turns=none даёт per-Task verdict; stale/inconclusive остаётся In Review. Перед Done — Strategic Explainer comment о непроведённой functional check и residual risk. Соблюдай authority и дай SHIPTASK RUN REPORT."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
