interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks для выбранного Task Manager scope. Разреши live scope; task-owned worktree/branch продолжай только при exclusive ownership. Соблюди natural-language правила пользователя; без такого правила выбери полезную delegation автоматически, writers — по отдельным feature branches и Git worktrees. `blocked by` открывает dependent implementation после fan-in нужного upstream contract, не после Done. Сделай targeted gate каждой Task. Периодический UAT batch release — один exact candidate в verified UAT; UAT — разрешённый non-production effect, UAT read-back/smoke обязателен. Не ослабляй acceptance: fallback допустим лишь когда нет To Do/In Progress, все remaining In Review verification-blocked и требуют substantial human verifier, не bounded unlocker. Ровно один read-only critic с fork_turns=none даёт per-Task verdict; stale/inconclusive остаётся In Review. Перед Done — Strategic Explainer comment о proof gap/risk. Соблюдай authority и дай SHIPTASK RUN REPORT."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
