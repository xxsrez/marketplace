interface:
  display_name: "Ship Tasks"
  short_description: "Доставить выбранный Task Manager scope"
  default_prompt: "Используй $ship-tasks. До новой implementation surface найди существующие exact Task worktrees/branches и partial changes: если прежний writer остановлен и ownership exclusive, прими тот же task-owned artifact и продолжай там вместо нового checkout или повтора; active/unknown ownership не перехватывай и не очищай. Сначала исполни effective natural-language topology rule пользователя: exact/relative число subagents (root не считается), role-scoped/global opt-out или условие по длительности, сложности либо другому названному признаку; совместимые правила комбинируй. Только без такого rule автоматически делегируй реально независимую полезную работу. Не создавай fake packets и не нарушай safety, authority, ownership, worktree isolation или fan-in ради quota; невозможность rule не подменяй молча. Основной агент — единственный integration owner и владелец Goal и Task Manager comments/status/version writes. Каждый concurrent implementation writer до первой mutation получает собственные feature branch и Git worktree; один writable worktree не разделяется между writers, а exact объединённый result проверяет integration owner. Явный user profile для subagents приоритетен; без него только genuinely simple bounded packets запускай на gpt-5.6-luna/max, остальные и Strategic Explainer наследуют current model/effort. При material uncertainty Luna прекращает corrective mutations, делает bounded read-back и передаёт packet integration owner/current profile без cheap retry loop. Goal создавай только для implementation/rework минимум двух Tasks; Backlog не доставляй, release-only работает без нового Goal. Не ослабляй acceptance. Обычный To Do → In Progress не создаёт комментарий. Пока effective rule не отключает comment Explainer, каждый комментарий ShipTask до публикации обязательно передай отдельному независимому $ship-tasks:strategic-explainer; иначе примени quality contract напрямую без claim независимости. Переход выполняй только после comment/read-back. Приёмочный incident немедленно покажи в chat и зафиксируй opening comment до repair; success закрывай только после completion comment."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
