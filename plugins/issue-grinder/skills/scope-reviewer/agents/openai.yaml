interface:
  display_name: "Scope Reviewer"
  short_description: "Проверить план перед запуском или долгий Release"
  default_prompt: "Используй $issue-grinder:scope-reviewer, чтобы проверить план перед запуском или понятно объяснить ход активного долгого Task Manager delivery run; меняй agent-owned план только по моему явному запросу и никогда не меняй Human Requirements."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases, Tasks, hierarchy, relations и evidence"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
