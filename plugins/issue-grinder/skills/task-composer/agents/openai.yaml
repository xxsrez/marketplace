interface:
  display_name: "Task Composer"
  short_description: "Сформулировать и связать Task Manager задачи"
  default_prompt: "Используй $issue-grinder:task-composer: сохрани требования человека, выбери одну Task либо Epic с конкретными подзадачами, создай planning scope только при явном запросе, назначь live Labels и реальные relations, помести всё в Backlog. Каждому элементу назначь явно выбранный Release либо единственный active Release проекта из Task Manager; при нуле или нескольких активных релизах остановись до записи и запроси уточнение. Отсутствующий подходящий Label не выдумывай и сообщи пробел."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases, Tasks, Labels и relations"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
