interface:
  display_name: "Issue Grinder"
  short_description: "Довести Task Manager scope до результата"
  default_prompt: "Используй $issue-grinder, чтобы выбранный Task Manager scope получил проверенный результат в режиме Соло по умолчанию либо в другом режиме, который я назвал явно."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases, issues и lifecycle"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
