interface:
  display_name: "Issue Grinder"
  short_description: "Довести Task Manager scope до результата"
  default_prompt: "Используй $issue-grinder, чтобы довести выбранный Task Manager scope до проверенного terminal результата."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases, issues и lifecycle"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
